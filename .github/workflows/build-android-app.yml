name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: 24,31,33,34
          build-tools-version: 34.0.0
          ndk-version: 26.1.10909125

      - name: Create capacitor.config.json if missing
        run: |
          if [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.chaosroom.harleyquinn",
            "appName": "Chaos Study Room",
            "webDir": ".",
            "server": {"androidScheme": "https"},
            "android": {"buildOptions": {"keystorePath": "~/.android/release-key.keystore"}},
            "plugins": {
              "SplashScreen": {"launchShowDuration": 3000, "launchAutoHide": true, "backgroundColor": "#08080d"},
              "StatusBar": {"style": "dark", "backgroundColor": "#08080d"}
            }
          }
          EOF
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: chaos-study-room-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
